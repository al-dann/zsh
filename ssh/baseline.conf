# ~/.config/zsh/ssh/baseline.conf — SSH client defaults for every host.
#
# Include it at the END of ~/.ssh/config (see README / install.sh):
#   Match all
#     Include ~/.config/zsh/ssh/baseline.conf
# ssh uses the FIRST value it obtains for each option, so anything set for a
# specific host above that line wins over these defaults.
#
# Deliberately NOT here (set them per host, above the Include):
# - IdentitiesOnly + IdentityFile: with no key files on disk (keys only in an agent,
#   e.g. the OrbStack guest using the Mac's forwarded agent) a global IdentitiesOnly
#   offers nothing. Per host, IdentityFile may point at the PUBLIC key; the agent signs.
# - ControlMaster/ControlPersist: a shared master socket lets any process running as
#   you reuse the authenticated connection without re-auth (or FIDO2 touch).

IgnoreUnknown UseKeychain
UseKeychain yes              # macOS: load key passphrases from the keychain; ignored elsewhere
AddKeysToAgent yes
ForwardAgent no              # a forwarded agent can be used by root on the remote host
ForwardX11 no
HashKnownHosts yes           # known_hosts no longer reveals where you connect; look up with ssh-keygen -F <host>
ServerAliveInterval 60
ServerAliveCountMax 3

# Runs every pre-commit hook (guards and manual-stage judgements) on the whole tree,
# so a commit made with --no-verify, or from a machine without hooks, is still checked.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install zsh (for the zsh -n hook)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0

      # The manual stage also includes every hook without an explicit `stages`,
      # so this single run covers the commit-time guards too.
      - name: Run all hooks
        run: pre-commit run --hook-stage manual --all-files --show-diff-on-failure
